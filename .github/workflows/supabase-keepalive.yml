# Backup keepalive for the free-tier Supabase project (it pauses after 7 idle days).
# Independent of Vercel: calls Supabase directly. The primary pinger is the Vercel cron in
# vercel.json; this runs twice a day so either one alone keeps the project awake.
#
# Each step is independent and retried; the job fails only if every step fails.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL        e.g. https://xxxx.supabase.co           (required)
#   SUPABASE_ANON_KEY   the public anon key                      (required)
#   APP_URL             e.g. https://tempper.vercel.app          (optional, extra path)
#   CRON_SECRET         same value as in Vercel, if you set one  (optional)

name: Supabase keepalive

on:
  schedule:
    - cron: "43 9,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert keepalive row (rpc)
        id: rpc
        continue-on-error: true
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 \
            -X POST "$URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"src":"github-actions"}'

      - name: Read through the REST API
        id: rest
        continue-on-error: true
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 \
            "$URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      - name: Auth health check
        id: auth
        continue-on-error: true
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 \
            "$URL/auth/v1/health" -H "apikey: $KEY"

      - name: Trigger the app's keepalive route
        id: app
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL not set, skipping"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 \
            "$APP_URL/api/keepalive?source=github-actions" \
            ${CRON_SECRET:+-H "Authorization: Bearer $CRON_SECRET"}

      - name: Fail only if every step failed
        if: steps.rpc.outcome != 'success' && steps.rest.outcome != 'success' && steps.auth.outcome != 'success' && steps.app.outcome != 'success'
        run: |
          echo "All keepalive steps failed. Check the secrets and that the project is not already paused."
          exit 1
